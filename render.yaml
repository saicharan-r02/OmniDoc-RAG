services:
  - type: web
    name: omnidoc-rag
    runtime: python
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: python api.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: VECTOR_DB_URL
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_PAGE_ID
        sync: false