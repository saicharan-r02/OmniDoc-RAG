app:
  name: "OmniDoc AI"
  description: "Academic RAG Assistant for Engineering Students"
  version: "2.0.0"

database:
  persist_directory: "./pdf_db/chromadb"
  collection_name: "Document__C"
  cloud_zip_path: "./PDF_db.zip"

embeddings:
  model_name: "all-MiniLM-L6-v2"
  device: "cpu"

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 12
  min_context_length: 60
  keyword_min_length: 4
  relevance_threshold: 0.25

llm:
  default_groq_model: "openai/gpt-oss-120b"
  available_groq_models:
    - "openai/gpt-oss-120b"
    - "qwen/qwen3.6-27b"
    - "openai/gpt-oss-20b"
    - "groq/compound-mini"
    - "groq/compound"
    - "allam-2-7b"
    - "meta-llama/llama-4-scout-17b-16e-instruct"
    - "llama-3.3-70b-versatile"
    - "llama-3.1-8b-instant"
  default_ollama_model: "llama3.2:latest"
  temperature: 0.0

paths:
  data_dir: "./PDF_Data"
  chat_sessions_dir: "./chat_history_sessions"
  logs_dir: "./logs"